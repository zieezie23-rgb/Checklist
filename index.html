</head><body><header><h1>Checklist Simulasi</h1><div class="sub">Monitoring simulasi bulanan</div></header><main class="wrap"><section id="dashboard"></section><section id="checklist" class="hidden"></section><section id="settings" class="hidden"></section></main><nav class="nav"><button id="nDash" onclick="show('dashboard')">Beranda</button><button id="nSet" onclick="show('settings')">Pengaturan</button></nav><script>
const months=['JANUARI','FEBRUARI','MARET','APRIL','MEI','JUNI','JULI','AGUSTUS','SEPTEMBER','OKTOBER','NOVEMBER','DESEMBER'];
const defaults={2026:['– Tidak Ada','– Tidak Ada','– Tidak Ada','– Tidak Ada','– Tidak Ada','– Tidak Ada','– Tidak Ada','☑ Selesai','☐ Belum','☐ Belum','☐ Belum','☐ Belum'],2027:Array(12).fill('☐ Belum'),2028:Array(12).fill('☐ Belum'),2029:Array(12).fill('☐ Belum'),2030:Array(12).fill('☐ Belum'),2031:Array(12).fill('☐ Belum'),2032:Array(12).fill('☐ Belum'),2033:['☐ Belum','☐ Belum','☐ Belum','☐ Belum','☐ Belum','☐ Belum','☐ Belum','– Tidak Ada','– Tidak Ada','– Tidak Ada','– Tidak Ada','– Tidak Ada']};
let data=JSON.parse(localStorage.getItem('simulasiData')||'null')||defaults; let active=Number(localStorage.getItem('activeYear')||2026); let target=Number(localStorage.getItem('target')||100); let years=Object.keys(data);
function save(){localStorage.setItem('simulasiData',JSON.stringify(data));localStorage.setItem('activeYear',active);localStorage.setItem('target',target)}
function counts(y){let a=data[y]||[];return {done:a.filter(x=>x.includes('Selesai')).length,bad:a.filter(x=>x.includes('Belum')).length,na:a.filter(x=>x.includes('Tidak Ada')).length}}
function dash(){
  years=Object.keys(data);
  let allDone=years.reduce((n,y)=>n+counts(y).done,0);
  let allBad=years.reduce((n,y)=>n+counts(y).bad,0);
  let allNa=years.reduce((n,y)=>n+counts(y).na,0);
  let total=allDone+allBad;
  let p=total?allDone/total*100:0;
  let status=p>=target?'TARGET TERCAPAI':p>=50?'DALAM PROSES':'PERLU TINDAKAN';
  document.getElementById('dashboard').innerHTML=`
    <div class="card hero">
      <div class="row"><span class="muted">2026–2033</span><b class="hero-pct">${Math.round(p)}%</b></div>
      <div class="progress"><div class="bar" style="width:${Math.min(p,100)}%"></div></div>
      <div class="row"><span class="muted">${total} bulan · Target ${target}%</span><b class="hero-status ${p<50?"danger":p<100?"process":"achieved"}">${p<50?"⚠️ Perlu Tindakan":p<100?"⚠️ Dalam Proses":"☑ Target Tercapai"}</b></div>
    </div>
    <div class="card">
      <div class="stats">
        <div class="stat"><span class="muted">TOTAL</span><b class="orange">${total}</b></div>
        <div class="stat"><span class="muted">SELESAI</span><b class="green">${allDone}</b></div>
        <div class="stat"><span class="muted">BELUM</span><b class="orange">${allBad}</b></div>
      </div>
      
    </div>
    <div class="card">
      <div class="row"><b>Checklist ${active}</b>
        <select onchange="active=+this.value;save();render()" style="width:100px;padding:6px">
          ${years.map(y=>`<option ${+y===active?'selected':''}>${y}</option>`).join('')}
        </select>
      </div>
      <div class="months">
        ${months.map((mo,i)=>{let s=data[active][i],locked=s.includes('Tidak Ada'),icon=s.includes('Selesai')?'☑':locked?'–':'☐';return `<button class="month ${s.includes('Selesai')?'done':locked?'na':''}" ${locked?'disabled':''} onclick="${locked?'return false;':`cycle(${active},${i})`}"><span>${mo.slice(0,3)}</span><span class="s">${icon}</span></button>`}).join('')}
      </div>
    </div>
    <div class="card">
      <div class="row"><b>Rekap per Tahun</b><span class="muted">2026–2033</span></div>
      <div style="overflow:auto">
        <table class="year-table">
          <thead><tr><th>Tahun</th><th>Total</th><th>Selesai</th><th>Belum</th><th>Tidak Ada</th><th>%</th></tr></thead>
          <tbody>
            ${years.map(y=>{let x=counts(y),t=x.done+x.bad,q=t?x.done/t*100:0;return `<tr><td><b>${y}</b></td><td class="orange">${t}</td><td class="green">${x.done}</td><td class="orange">${x.bad}</td><td class="red">${x.na}</td><td class="green"><b>${Math.round(q)}%</b></td></tr>`}).join('')}
            <tr class="total"><td>TOTAL</td><td class="orange">${total}</td><td class="green">${allDone}</td><td class="orange">${allBad}</td><td class="red">${allNa}</td><td class="green">${Math.round(p)}%</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <div class="row"><b>Grafik Progress Tahunan</b><span class="muted">2026–2033</span></div>
      <div class="chart"><canvas id="yearLineChart"></canvas></div>
    </div>`;
}
function drawYearLineChart(){const cv=document.getElementById('yearLineChart');if(!cv)return;let w=cv.getBoundingClientRect().width||cv.parentElement.clientWidth||cv.clientWidth;if(!w){requestAnimationFrame(drawYearLineChart);return}const d=devicePixelRatio||1,h=250;cv.width=w*d;cv.height=h*d;const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);const L=34,R=10,T=12,B=30,p=(w-L-R)/(years.length-1),v=years.map(y=>{let z=counts(y),t=z.done+z.bad;return t?z.done/t*100:0});c.clearRect(0,0,w,h);c.font='14px sans-serif';c.lineWidth=1;c.strokeStyle='#d6c9ad';c.fillStyle='#68756f';for(let n=0;n<=100;n+=25){let yy=T+(h-T-B)*(1-n/100);c.beginPath();c.moveTo(L,yy);c.lineTo(w-R,yy);c.stroke();c.fillText(n+'%',3,yy+3)}c.strokeStyle='#e07a3f';c.lineWidth=2.5;c.beginPath();v.forEach((n,i)=>{let x=L+i*p,y=T+(h-T-B)*(1-n/100);i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();v.forEach((n,i)=>{let x=L+i*p,y=T+(h-T-B)*(1-n/100);c.fillStyle='#e07a3f';c.beginPath();c.arc(x,y,3.5,0,Math.PI*2);c.fill();c.fillStyle='#68756f';c.textAlign='center';c.fillText(years[i],x,h-8)});c.textAlign='start'}
function cycle(y,i){let s=data[y][i];if(s.includes('Tidak Ada'))return;data[y][i]=s.includes('Selesai')?'☐ Belum':'☑ Selesai';save();render()}
function check(){document.getElementById('checklist').innerHTML='';}
function settings(){document.getElementById('settings').innerHTML=`<div class="card"><b>Pengaturan</b><p class="muted">Pengaturan disimpan otomatis di perangkat.</p><label>Tahun aktif</label><select id="sy" onchange="active=+this.value;save();render()">${Object.keys(data).map(y=>`<option ${+y===active?'selected':''}>${y}</option>`).join('')}</select><br><br><label>Target minimal (%)</label><input type="number" min="0" max="100" value="${target}" onchange="target=Math.max(0,Math.min(100,+this.value||0));save();render()"></div><div class="card"><b>Data</b><p class="muted">Data checklist tersimpan lokal di HP. Tidak perlu internet setelah aplikasi dibuka.</p><button onclick="if(confirm('Kembalikan semua data ke kondisi awal file Excel?')){data=JSON.parse(JSON.stringify(defaults));active=2026;target=100;save();render()}" style="padding:12px;border:1px solid rgba(232,96,79,.25);border-radius:12px;background:rgba(232,96,79,.1);color:#e8604f;font-weight:700">Reset ke data awal</button></div>`}
function show(id){let home=id==='dashboard';document.getElementById('dashboard').classList.toggle('hidden',!home);document.getElementById('checklist').classList.toggle('hidden',!home);document.getElementById('settings').classList.toggle('hidden',home);document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById(home?'nDash':'nSet').classList.add('active');render(id)}
function render(){dash();check();settings();requestAnimationFrame(drawYearLineChart)}show('dashboard'); if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script><style>
header{padding:10px 16px}
.hero-pct{font-size:28px!important}
.hero-status{font-size:15px!important;font-weight:800!important}
.hero-status.danger{color:#fff;background:#b52d27;padding:2px 7px;border-radius:7px;animation:dangerPulse .75s infinite, dangerShake .16s infinite}

@keyframes dangerPulse{0%,100%{opacity:1}50%{opacity:.55}}

<script>
/* Tinggi kanvas grafik mengikuti CSS baru agar tetap tajam dan proporsional */
function drawYearLineChart(){
    const cv=document.getElementById('yearLineChart');
    if(!cv)return;
    let w=cv.getBoundingClientRect().width||cv.parentElement.clientWidth||cv.clientWidth;
    if(!w){requestAnimationFrame(drawYearLineChart);return}
    const d=devicePixelRatio||1,h=195;
    cv.width=w*d;cv.height=h*d;
    const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);
    const L=34,R=10,T=10,B=27,p=years.length>1?(w-L-R)/(years.length-1):0;
    const v=years.map(y=>{let z=counts(y),t=z.done+z.bad;return t?z.done/t*100:0});
    c.clearRect(0,0,w,h);
    c.font='13px sans-serif';c.lineWidth=1;c.strokeStyle='#d6c9ad';c.fillStyle='#68756f';
    for(let n=0;n<=100;n+=25){
        let yy=T+(h-T-B)*(1-n/100);
        c.beginPath();c.moveTo(L,yy);c.lineTo(w-R,yy);c.stroke();
        c.fillText(n+'%',3,yy+3);
    }
    c.strokeStyle='#e07a3f';c.lineWidth=2.5;c.beginPath();
    v.forEach((n,i)=>{
        let x=L+i*p,y=T+(h-T-B)*(1-n/100);
        i?c.lineTo(x,y):c.moveTo(x,y);
    });
    c.stroke();
    v.forEach((n,i)=>{
        let x=L+i*p,y=T+(h-T-B)*(1-n/100);
        c.fillStyle='#e07a3f';c.beginPath();c.arc(x,y,3.5,0,Math.PI*2);c.fill();
        c.fillStyle='#68756f';c.textAlign='center';c.fillText(years[i],x,h-7);
    });
    c.textAlign='start';
}
</script>

<script>
/* ===== GitHub Auto Sync ===== */
const CHECKLIST_SYNC_DEFAULT_URL = "https://checklist-sync.zieezie23.workers.dev";
let checklistSyncTimer = null;
function syncCfg(){return {url:(localStorage.getItem("syncUrl")||CHECKLIST_SYNC_DEFAULT_URL).trim().replace(/\/+$/,""),key:(localStorage.getItem("syncKey")||"").trim()}}
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;")}
function syncStatus(t){localStorage.setItem("syncStatus",t);const e=document.getElementById("syncStatus");if(e)e.textContent=t}
function saveSyncSettings(){const u=document.getElementById("syncUrl"),k=document.getElementById("syncKey"),a=document.getElementById("autoSync");if(u)localStorage.setItem("syncUrl",u.value.trim());if(k)localStorage.setItem("syncKey",k.value.trim());if(a)localStorage.setItem("autoSync",a.checked?"1":"0");syncStatus("Pengaturan sinkronisasi disimpan.")}
function save(){localStorage.setItem("simulasiData",JSON.stringify(data));localStorage.setItem("activeYear",active);localStorage.setItem("target",target);scheduleChecklistSync()}
function scheduleChecklistSync(){if(localStorage.getItem("autoSync")==="0")return;const c=syncCfg();if(!c.url||!c.key)return;clearTimeout(checklistSyncTimer);checklistSyncTimer=setTimeout(()=>syncNow(true),1200)}
async function syncNow(silent=false){const c=syncCfg();if(!c.url||!c.key){if(!silent)alert("Isi URL Worker dan Kunci Sinkronisasi terlebih dahulu.");return false}syncStatus("☁️ Menyimpan ke GitHub...");try{const payload={app:"Checklist Simulasi",version:2,updatedAt:new Date().toISOString(),activeYear:active,target:target,data:data};const r=await fetch(c.url,{method:"POST",headers:{"Content-Type":"application/json","X-Sync-Key":c.key},body:JSON.stringify(payload)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||("HTTP "+r.status));syncStatus("✓ Tersimpan ke GitHub · "+new Date().toLocaleTimeString("id-ID"));return true}catch(e){syncStatus("⚠️ Sync gagal · data lokal tetap aman");if(!silent)alert("Sync gagal: "+e.message);return false}}
function validChecklistData(obj){if(!obj||typeof obj!=="object")return false;const ys=Object.keys(obj);if(!ys.length)return false;return ys.every(y=>Array.isArray(obj[y])&&obj[y].length===12)}
async function pullFromGithub(silent=false){const c=syncCfg();if(!c.url||!c.key){if(!silent)alert("Isi URL Worker dan Kunci Sinkronisasi terlebih dahulu.");return false}syncStatus("☁️ Mengambil data dari GitHub...");try{const r=await fetch(c.url,{headers:{"X-Sync-Key":c.key},cache:"no-store"});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||("HTTP "+r.status));const remote=j.data?j:{data:j,activeYear:active,target:target};if(!validChecklistData(remote.data)){syncStatus("ℹ️ GitHub masih kosong · data lokal dipertahankan");return false}data=remote.data;active=Number(remote.activeYear||active);target=Number(remote.target??target);localStorage.setItem("simulasiData",JSON.stringify(data));localStorage.setItem("activeYear",active);localStorage.setItem("target",target);render();syncStatus("✓ Data terbaru dimuat dari GitHub · "+new Date().toLocaleTimeString("id-ID"));if(!silent)alert("Data berhasil diambil dari GitHub.");return true}catch(e){syncStatus("⚠️ Gagal mengambil data dari GitHub");if(!silent)alert("Restore gagal: "+e.message);return false}}
function ensureLocalData(){if(!validChecklistData(data)){data=JSON.parse(JSON.stringify(defaults));active=2026;target=100;localStorage.setItem("simulasiData",JSON.stringify(data));localStorage.setItem("activeYear",active);localStorage.setItem("target",target);return true}return false}
function settings(){document.getElementById("settings").innerHTML=`<div class="card"><b>Pengaturan</b><p class="muted">Pengaturan disimpan otomatis di perangkat.</p><label>Tahun aktif</label><select id="sy" onchange="active=+this.value;save();render()">${Object.keys(data).map(y=>`<option ${+y===active?"selected":""}>${y}</option>`).join("")}</select><br><br><label>Target minimal (%)</label><input type="number" min="0" max="100" value="${target}" onchange="target=Math.max(0,Math.min(100,+this.value||0));save();render()"></div><div class="card"><b>☁️ Sinkronisasi GitHub</b><p class="muted">Perubahan checklist dapat otomatis disimpan ke GitHub melalui Cloudflare Worker.</p><div class="sync-box"><label>URL Worker</label><input id="syncUrl" class="sync-input" type="url" placeholder="https://nama-worker.nama-akun.workers.dev" value="${esc(localStorage.getItem("syncUrl")||CHECKLIST_SYNC_DEFAULT_URL)}" onchange="saveSyncSettings()"><label style="display:block;margin-top:10px">Kunci Sinkronisasi</label><input id="syncKey" class="sync-input" type="password" placeholder="SYNC_KEY yang sama di Worker" value="${esc(localStorage.getItem("syncKey")||"")}" onchange="saveSyncSettings()"><label style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px"><input id="autoSync" type="checkbox" ${localStorage.getItem("autoSync")!=="0"?"checked":""} onchange="saveSyncSettings()"> Sinkron otomatis saat data berubah</label><div class="sync-actions"><button class="sync-btn main" type="button" onclick="syncNow()">🔄 Sync Sekarang</button><button class="sync-btn alt" type="button" onclick="pullFromGithub()">↧ Ambil dari GitHub</button></div><div id="syncStatus" class="sync-status">${esc(localStorage.getItem("syncStatus")||"Belum disinkronkan")}</div></div></div><div class="card"><b>Data</b><p class="muted">Data checklist tersimpan lokal dan dapat dicadangkan ke GitHub.</p><button onclick="if(confirm('Kembalikan semua data ke kondisi awal?')){data=JSON.parse(JSON.stringify(defaults));active=2026;target=100;save();render()}" style="padding:12px;border:1px solid rgba(232,96,79,.25);border-radius:12px;background:rgba(232,96,79,.1);color:#e8604f;font-weight:700">Reset ke data awal</button></div>`}
async function autoPullOnStart(){const c=syncCfg();if(!c.url||!c.key)return;const repaired=ensureLocalData();if(repaired)render();const loaded=await pullFromGithub(true);if(!loaded){const remoteEmpty=localStorage.getItem("syncStatus")?.includes("GitHub masih kosong");if(remoteEmpty)await syncNow(true)}}
setTimeout(autoPullOnStart,300);
</script><style>

.sync-btn{border:0;border-radius:12px;padding:11px 10px;font:inherit;font-weight:700;cursor:pointer}.sync-btn.main{background:#e07a3f;color:#fff}.sync-btn.alt{background:rgba(224,122,63,.1);color:#c76531;border:1px solid rgba(224,122,63,.2)}
.sync-status{font-size:12px;margin-top:8px;opacity:.72}

</style>
